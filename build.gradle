plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gradleup.shadow' version '9.3.0'
}

import groovy.json.JsonOutput
import org.gradle.internal.os.OperatingSystem
import org.gradle.api.file.DuplicatesStrategy

// Force le nom des jars (au lieu de ExamplePlugin-*)
base {
    archivesName = "Nations"
}

// --------------------
// Detect Hytale install
// --------------------
ext {
    if (project.hasProperty('hytale_home')) {
        hytaleHome = project.findProperty('hytale_home')
    } else {
        def os = OperatingSystem.current()
        if (os.isWindows()) {
            hytaleHome = "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
        } else if (os.isMacOsX()) {
            hytaleHome = "${System.getProperty("user.home")}/Library/Application Support/Hytale"
        } else if (os.isLinux()) {
            hytaleHome = "${System.getProperty("user.home")}/.var/app/com.hypixel.HytaleLauncher/data/Hytale"
            if (!file(hytaleHome).exists()) {
                hytaleHome = "${System.getProperty("user.home")}/.local/share/Hytale"
            }
        }
    }
}

if (!project.hasProperty('hytaleHome')) {
    throw new GradleException('Your Hytale install could not be detected automatically. If you are on an unsupported platform or using a custom install location, please define the install location using the hytale_home property.')
} else if (!file(project.findProperty('hytaleHome')).exists()) {
    throw new GradleException("Failed to find Hytale at the expected location. Please make sure you have installed the game. The expected location can be changed using the hytale_home property. Currently looking in ${project.findProperty('hytaleHome')}")
}

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// --------------------
// Shadow configuration (comme SimpleClaims)
// --------------------
configurations {
    shadowBundle
    implementation.extendsFrom(shadowBundle)
}

// IMPORTANT:
// - HytaleServer.jar doit être compileOnly (jamais dans ton jar final)
// - sqlite-jdbc doit être dans shadowBundle (embarqué dans Nations.jar)
dependencies {
    compileOnly(files("$hytaleHome/install/$patchline/package/game/$game_build/Server/HytaleServer.jar"))
    shadowBundle("org.xerial:sqlite-jdbc:3.46.1.0")
}

// Evite certains conflits de copie
tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Jar normal à part (utile pour debug)
tasks.named('jar') {
    archiveClassifier.set('plain')
}

// --------------------
// manifest.json expansion
// --------------------
processResources {
    def props = [
            plugin_name     : (findProperty("plugin_name") ?: project.name).toString(),
            plugin_group    : (findProperty("plugin_group") ?: project.group ?: "").toString(),
            plugin_version  : (findProperty("plugin_version") ?: project.version ?: "0.0.0").toString(),
            entry_point     : (findProperty("entry_point") ?: "").toString(),
            mod_description : (findProperty("mod_description") ?: "").toString(),
            website         : (findProperty("website") ?: "").toString(),
            server_version  : (findProperty("server_version") ?: "*").toString(),
            includes_pack   : (findProperty("includes_pack") ?: "false").toString().toBoolean()
    ]

    inputs.properties(props)

    filesMatching("manifest.json") {
        expand(props)
    }
}

// --------------------
// Run dir
// --------------------
def serverRunDir = file("$projectDir/run")
if (!serverRunDir.exists()) {
    serverRunDir.mkdirs()
}

def createServerRunArguments(String srcDir) {
    def programParameters = '--allow-op --disable-sentry --assets="' + "${hytaleHome}/install/$patchline/package/game/$game_build/Assets.zip" + '"'
    def modPaths = []
    if (includes_pack.toBoolean()) {
        modPaths << srcDir
    }
    if (load_user_mods.toBoolean()) {
        modPaths << "${hytaleHome}/UserData/Mods"
    }
    if (!modPaths.isEmpty()) {
        programParameters += ' --mods="' + modPaths.join(',') + '"'
    }
    return programParameters
}

idea.project.settings.runConfigurations {
    'HytaleServer'(org.jetbrains.gradle.ext.Application) {
        mainClass = 'com.hypixel.hytale.Main'
        moduleName = project.idea.module.name + '.main'
        programParameters = createServerRunArguments(sourceSets.main.java.srcDirs.first().parentFile.absolutePath)
        workingDirectory = serverRunDir.absolutePath
    }
}

tasks.register('generateVSCodeLaunch') {
    def vscodeDir = file("$projectDir/.vscode")
    def launchFile = file("$vscodeDir/launch.json")
    doLast {
        if (!vscodeDir.exists()) {
            vscodeDir.mkdirs()
        }
        def programParams = createServerRunArguments("\${workspaceFolder}")
        def launchConfig = [
                version: "0.2.0",
                configurations: [
                        [
                                type: "java",
                                name: "HytaleServer",
                                request: "launch",
                                mainClass: "com.hypixel.hytale.Main",
                                args: programParams,
                                cwd: "\${workspaceFolder}/run"
                        ]
                ]
        ]
        launchFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(launchConfig))
    }
}

// --------------------
// FAT JAR
// --------------------
shadowJar {
    archiveClassifier.set('')      // => Nations.jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()

    // Signatures inutiles qui peuvent casser les jars
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    // On ne met QUE ce qu’il faut dans le fat jar
    configurations = [project.configurations.shadowBundle]
}

// ./gradlew build => produit le fat jar
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
